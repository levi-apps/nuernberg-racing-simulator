# Baut die Spielwelt aus dem aktuellen OSM-Auszug und veröffentlicht das Spiel auf GitHub Pages.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # wöchentlich mit frischen Kartendaten
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: OSM-Auszug (Cache je Kalenderwoche)
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: osm-${{ steps.week.outputs.week }}
      - run: npm run data:download
      - run: npm run data:build
      - name: Spiel bauen
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
